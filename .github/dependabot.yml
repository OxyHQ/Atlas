# Dependabot configuration. Only first-party Oxy SDKs are delegated to it, and
# the `oxy` group's PR auto-merges (.github/workflows/automerge-first-party.yml).
# `allow` keeps every third-party dependency a manual `bun install`.
version: 2

updates:
  - package-ecosystem: "bun"
    directories:
      - "/"
    # Weekly, and on a day of its own: the org shares 20 concurrent Actions
    # jobs, and every version-update PR runs CI. Security updates do not wait
    # for this schedule.
    schedule:
      interval: "weekly"
      day: "thursday"
      time: "06:00"
      timezone: "Europe/Bucharest"
    open-pull-requests-limit: 5
    versioning-strategy: increase
    allow:
      - dependency-name: "@oxy.so/*"
    groups:
      # Listed FIRST: a dependency joins the first group it matches.
      oxy:
        patterns:
          - "@oxy.so/*"
      # Minor and patch updates as ONE pull request; majors arrive one per
      # dependency. While `allow` names only @oxy.so/*, everything it admits
      # lands in `oxy` above, so this group is empty until `allow` widens.
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
