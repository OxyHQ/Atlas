name: Deploy to Cloudflare Pages

# Atlas is a frontend and nothing else. Its data comes from oxy-api, which is
# deployed from OxyHQServices, so there is no backend here to build, no image to
# push and no ECS service to wait on — a web export and a Pages deploy is the
# whole of it.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-atlas
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      # tsc before the export: `expo export` bundles happily through a type
      # error, so without this a broken build ships as a working deploy.
      - run: bun run --cwd packages/frontend typecheck

      - run: bun run build:frontend
        env:
          EXPO_PUBLIC_API_URL: https://api.oxy.so
          # Atlas's production Oxy client id. A repo VARIABLE, not a secret: the
          # id travels inside the bundle, so it is public by construction, and
          # hiding it would only cost the ability to check what production uses.
          EXPO_PUBLIC_OXY_CLIENT_ID: ${{ vars.EXPO_PUBLIC_OXY_CLIENT_ID }}

      # `pages deploy` does not create a project — it fails with
      # "Project not found" — and a first deploy from a fresh repo has nothing
      # to deploy into. Asking the API rather than tolerating the create's error
      # keeps a real failure (bad token, wrong account) loud.
      - name: Ensure the Pages project exists
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/atlas")
          if [ "$status" = "200" ]; then
            echo "Pages project 'atlas' already exists."
          elif [ "$status" = "404" ]; then
            echo "Creating Pages project 'atlas'…"
            curl -sf -X POST \
              -H "Authorization: Bearer $CF_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data '{"name":"atlas","production_branch":"main"}' \
              "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects" > /dev/null
            echo "Created."
          else
            echo "::error::Cloudflare answered $status when asked about the project."
            exit 1
          fi

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # `--commit-dirty`: a CI workspace is dirty by construction after an
          # install and an export, and the warning is not about the deploy.
          command: pages deploy packages/frontend/dist --project-name=atlas --branch=main --commit-dirty=true

      # Attach atlas.oxy.so once. Cloudflare answers 409 when the domain is
      # already on the project, which is the steady state after the first run —
      # so that case is success, and anything else is reported.
      - name: Ensure atlas.oxy.so points at this project
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -uo pipefail
          status=$(curl -s -o /tmp/cf-domain.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"name":"atlas.oxy.so"}' \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/atlas/domains")
          case "$status" in
            200|201) echo "atlas.oxy.so attached." ;;
            409)     echo "atlas.oxy.so was already attached." ;;
            *)       echo "Cloudflare answered $status:"; cat /tmp/cf-domain.json
                     echo "::warning::Could not attach atlas.oxy.so — attach it in the Pages dashboard."
                     ;;
          esac

          # Attaching the domain to the project does not create the DNS record,
          # so without this the name attaches and still does not resolve — which
          # is exactly what happened on the first run.
          zone=$(curl -s -H "Authorization: Bearer $CF_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones?name=oxy.so" \
            | python3 -c "import json,sys; r=json.load(sys.stdin).get('result') or []; print(r[0]['id'] if r else '')")
          if [ -z "$zone" ]; then
            echo "::warning::No Zone:Read on this token — add a proxied CNAME atlas → atlas.pages.dev by hand."
            exit 0
          fi
          existing=$(curl -s -H "Authorization: Bearer $CF_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones/$zone/dns_records?name=atlas.oxy.so" \
            | python3 -c "import json,sys; r=json.load(sys.stdin).get('result') or []; print(len(r))")
          if [ "$existing" != "0" ]; then
            echo "DNS record for atlas.oxy.so already exists."
            exit 0
          fi
          created=$(curl -s -o /tmp/cf-dns.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"type":"CNAME","name":"atlas","content":"atlas.pages.dev","proxied":true}' \
            "https://api.cloudflare.com/client/v4/zones/$zone/dns_records")
          if [ "$created" = "200" ]; then
            echo "Created CNAME atlas → atlas.pages.dev (proxied)."
          else
            echo "Cloudflare answered $created:"; cat /tmp/cf-dns.json
            echo "::warning::Could not create the DNS record — add a proxied CNAME atlas → atlas.pages.dev by hand."
          fi
