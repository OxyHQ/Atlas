name: Deploy to Cloudflare Pages

# Atlas is a frontend and nothing else. Its data comes from oxy-api, which is
# deployed from OxyHQServices, so there is no backend here to build, no image to
# push and no ECS service to wait on — a web export and a Pages deploy is the
# whole of it.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-atlas
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      # tsc before the export: `expo export` bundles happily through a type
      # error, so without this a broken build ships as a working deploy.
      - run: bun run --cwd packages/frontend typecheck

      - run: bun run build:frontend
        env:
          EXPO_PUBLIC_API_URL: https://api.oxy.so
          # Atlas's production Oxy client id. A repo VARIABLE, not a secret: the
          # id travels inside the bundle, so it is public by construction, and
          # hiding it would only cost the ability to check what production uses.
          EXPO_PUBLIC_OXY_CLIENT_ID: ${{ vars.EXPO_PUBLIC_OXY_CLIENT_ID }}

      # `pages deploy` does not create a project — it fails with
      # "Project not found" — and a first deploy from a fresh repo has nothing
      # to deploy into. Asking the API rather than tolerating the create's error
      # keeps a real failure (bad token, wrong account) loud.
      - name: Ensure the Pages project exists
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/atlas")
          if [ "$status" = "200" ]; then
            echo "Pages project 'atlas' already exists."
          elif [ "$status" = "404" ]; then
            echo "Creating Pages project 'atlas'…"
            curl -sf -X POST \
              -H "Authorization: Bearer $CF_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data '{"name":"atlas","production_branch":"main"}' \
              "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects" > /dev/null
            echo "Created."
          else
            echo "::error::Cloudflare answered $status when asked about the project."
            exit 1
          fi

      # `bunx wrangler@4`, NOT `cloudflare/wrangler-action` (forbidden
      # fleet-wide). The action installs its own wrangler mid-deploy
      # (`bun i wrangler@3.90.0`), which intermittently dies with
      # `Fail extracting tarball for "wrangler"` and publishes nothing. Pinned
      # to a major so a new one cannot change the deploy path with no diff.
      # wrangler reads its credentials from `env:`.
      #
      # `--commit-dirty`: a CI workspace is dirty by construction after an
      # install and an export, and the warning is not about the deploy.
      - name: Deploy to Cloudflare Pages
        run: bunx wrangler@4 pages deploy packages/frontend/dist --project-name=atlas --branch=main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Attach atlas.oxy.so once. Cloudflare answers 409 when the domain is
      # already on the project, which is the steady state after the first run —
      # so that case is success, and anything else is reported.
      # Make atlas.oxy.so reach this project: attach it to Pages AND point DNS
      # at the project's own hostname. Attaching alone does not create a record,
      # and a record aimed at the wrong host serves 403 rather than failing.
      - name: Ensure atlas.oxy.so points at this project
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -uo pipefail
          api="https://api.cloudflare.com/client/v4"
          auth="Authorization: Bearer $CF_API_TOKEN"

          status=$(curl -s -o /tmp/cf-domain.json -w '%{http_code}' -X POST \
            -H "$auth" -H "Content-Type: application/json" \
            --data '{"name":"atlas.oxy.so"}' \
            "$api/accounts/$CF_ACCOUNT_ID/pages/projects/atlas/domains")
          # 8000018 is "you have already added this custom domain", and
          # Cloudflare returns it as a 400 — not the 409 the API's shape
          # suggests. Matching on the status alone cried wolf on every run
          # after the first.
          already=$(python3 -c "import json;print(any(e.get('code')==8000018 for e in (json.load(open('/tmp/cf-domain.json')).get('errors') or [])))" 2>/dev/null || echo False)
          if [ "$status" = "200" ] || [ "$status" = "201" ]; then
            echo "atlas.oxy.so attached."
          elif [ "$already" = "True" ]; then
            echo "atlas.oxy.so was already attached."
          else
            echo "Cloudflare answered $status:"; cat /tmp/cf-domain.json
            echo "::warning::Could not attach atlas.oxy.so — attach it in the Pages dashboard."
          fi

          # The project's OWN pages.dev host. Pages appends a discriminator
          # (`atlas-9ep`), so a CNAME to the bare `atlas.pages.dev` reaches
          # nothing — which is exactly what served 403 on the first attempt.
          curl -s -H "$auth" "$api/accounts/$CF_ACCOUNT_ID/pages/projects/atlas" > /tmp/cf-project.json
          host=$(python3 -c "import json;print((json.load(open('/tmp/cf-project.json')).get('result') or {}).get('subdomain',''))")
          if [ -z "$host" ]; then
            echo "::warning::Could not read the project's pages.dev host; skipping DNS."
            exit 0
          fi
          echo "project host: $host"

          zone=$(curl -s -H "$auth" "$api/zones?name=oxy.so" \
            | python3 -c "import json,sys; r=json.load(sys.stdin).get('result') or []; print(r[0]['id'] if r else '')")
          if [ -z "$zone" ]; then
            echo "::warning::No Zone:Read on this token — point a proxied CNAME atlas at $host by hand."
            exit 0
          fi

          curl -s -H "$auth" "$api/zones/$zone/dns_records?name=atlas.oxy.so" > /tmp/cf-dns-list.json
          record_id=$(python3 -c "import json;r=(json.load(open('/tmp/cf-dns-list.json')).get('result') or [{}])[0];print(r.get('id',''))")
          record_host=$(python3 -c "import json;r=(json.load(open('/tmp/cf-dns-list.json')).get('result') or [{}])[0];print(r.get('content',''))")
          body=$(python3 -c "import json,sys;print(json.dumps({'type':'CNAME','name':'atlas','content':sys.argv[1],'proxied':True}))" "$host")

          if [ -n "$record_id" ] && [ "$record_host" = "$host" ]; then
            echo "DNS already points at $host."
            exit 0
          elif [ -n "$record_id" ]; then
            # Repointed rather than left alone: a record aimed at the wrong host
            # would serve 403 indefinitely and look like a Pages problem.
            echo "DNS points at '$record_host'; repointing at $host."
            code=$(curl -s -o /tmp/cf-dns.json -w '%{http_code}' -X PUT -H "$auth" \
              -H "Content-Type: application/json" --data "$body" \
              "$api/zones/$zone/dns_records/$record_id")
          else
            code=$(curl -s -o /tmp/cf-dns.json -w '%{http_code}' -X POST -H "$auth" \
              -H "Content-Type: application/json" --data "$body" \
              "$api/zones/$zone/dns_records")
          fi

          if [ "$code" = "200" ]; then
            echo "CNAME atlas -> $host (proxied)."
          else
            echo "Cloudflare answered $code:"; cat /tmp/cf-dns.json
            echo "::warning::Could not set DNS — point a proxied CNAME atlas at $host by hand."
          fi
