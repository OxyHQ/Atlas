name: Lint

# Biome does formatting and linting for the whole repo (root `biome.json`); the
# frontend's minimal ESLint keeps only the rules Biome has no equivalent for
# (eslint-plugin-expo's EXPO_PUBLIC_* checks, the React Compiler hooks checks).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    # About 20 seconds on a good run.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      # Expo SDK 58's CLI supports Node 22.13+ / 24.3+ only; pin a supported
      # major instead of trusting the runner image's default Node.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - run: bun install --frozen-lockfile --minimum-release-age=0

      - run: bun run test:store

      - name: Biome
        run: bunx biome ci .

      - name: ESLint (expo lint, minimal config)
        run: bun run --cwd packages/frontend lint
